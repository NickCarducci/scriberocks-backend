[package]
name = "scribe"
version = "0.1.0"
edition = "2024"
description = "Scriberocks language core: dictionary lexicon, POS tagger, clause frames"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
uniffi = "=0.32.2"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
opt-level = 3
